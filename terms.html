<!DOCTYPE html>

  <title>Terms of Use · FlightMode AI</title>
  <script>
  (function () {
    var S = ["en", "zh-Hans", "zh-Hant", "ja"];
    var k = "flightmode-site-lang";
    var s = localStorage.getItem(k);
    if (!s || S.indexOf(s) === -1) {
      var ls = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
      for (var i = 0; i < ls.length; i++) {
        var l = String(ls[i] || "").toLowerCase();
        if (l.indexOf("ja") === 0) { s = "ja"; break; }
        if (l.indexOf("zh") === 0) {
          s = (l.indexOf("hant") !== -1 || l.indexOf("tw") !== -1 || l.indexOf("hk") !== -1 || l.indexOf("mo") !== -1) ? "zh-Hant" : "zh-Hans";
          break;
        }
        if (l.indexOf("en") === 0) { s = "en"; break; }
      }
      s = s || "en";
    }
    document.documentElement.lang = s;
    document.documentElement.dataset.lang = s;
  })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
